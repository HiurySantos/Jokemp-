<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jokenpô Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Jokenpô</h1>
        <br>
        
        <div class="placar">
            <p>Vitórias: <span id="ponto-jogador">0</span></p>
            <p>Empates: <span id="ponto-empates">0</span></p>
            <p>Derrotas: <span id="ponto-computador">0</span></p>
            
        </div>

        <div class="botoes">
            <button id="Pedra">👊 Pedra</button>
            <button id="Papel">✋ Papel</button>
            <button id="Tesoura">✌️ Tesoura</button>
        </div>

        <div class="resultado">
            <p id="mensagem">Escolha uma opção para começar!</p>
            <br>
            <p>Computador escolheu: <strong id="escolha-pc">-</strong></p>
        </div>

        <br>

        <div>
            <button id="resetar">Zerar Placar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
